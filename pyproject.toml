[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-steer"
version = "0.3.0"
description = "A lightweight runtime steering layer for AI agents — inject guidance into running agents without restarting the task."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "hjzzZzz622"}]
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
agent-steer = "agent_steer.cli:main"
agent-steer-mcp = "agent_steer.mcp:main"

[project.urls]
Repository = "https://github.com/hjzzZzz622/agent-steer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_steer.adapters" = ["*/README.md"]
"agent_steer" = ["skills/*.md"]
